<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#18243b">
  <title>Stickman Battle: Mountain Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-wrap">
    <header class="topbar">
      <div class="brand">⚔ STICKMAN <span>BATTLE</span></div>
      <div id="clock">05:00 • PAGI</div>
      <button id="pauseBtn" class="small-btn">Ⅱ</button>
    </header>
    <section class="hud">
      <div class="fighter-card">
        <div class="fighter-line"><b>PLAYER</b><span id="playerHpText">2000 / 2000 HP</span></div>
        <div class="bar"><div id="playerHp" class="fill hp"></div></div>
        <div class="fighter-line sub"><span id="className">Pendekar Pedang</span><span id="manaText">—</span></div>
        <div class="bar mana-bar"><div id="manaFill" class="fill mana"></div></div>
      </div>
      <div class="fighter-card enemy-card">
        <div class="fighter-line"><b>AI MUSUH</b><span id="enemyHpText">2500 / 2500 HP</span></div>
        <div class="bar"><div id="enemyHp" class="fill enemy-hp"></div></div>
        <div class="fighter-line sub"><span id="enemyState">Mengamati...</span><span>Pedang + Busur</span></div>
      </div>
    </section>
    <section class="arena">
      <canvas id="game" aria-label="Arena pertarungan stickman"></canvas>
      <div id="banner" class="banner hidden"></div>
      <div class="hint" id="hint">A/D atau ◀ ▶ untuk bergerak • J menyerang • K/L/I skill</div>
    </section>
    <section class="controls">
      <div class="move-controls">
        <button data-hold="left" aria-label="Kiri">◀</button>
        <button data-hold="right" aria-label="Kanan">▶</button>
        <button data-action="jump" aria-label="Lompat">⬆</button>
      </div>
      <div class="action-controls">
        <button data-action="attack" class="attack">SERANG <small>J</small></button>
        <button data-action="skill1">SKILL 1 <small>K</small></button>
        <button data-action="skill2">SKILL 2 <small>L</small></button>
        <button data-action="skill3">SKILL 3 <small>I</small></button>
      </div>
    </section>
    <section class="loadout">
      <div class="select-group">
        <label for="weapon">SENJATA</label>
        <select id="weapon">
          <option value="sword">⚔ Pedang — Pendekar Pedang</option>
          <option value="bow">🏹 Busur — Pemanah</option>
          <option value="spear">🔱 Tombak — Penombak</option>
          <option value="magic">✨ Sihir — Penyihir</option>
        </select>
      </div>
      <div class="select-group" id="magicGroup">
        <label for="magic">JENIS SIHIR</label>
        <select id="magic">
          <option value="dark">☾ Dark</option>
          <option value="light">✦ Light</option>
          <option value="blood">♥ Blood</option>
        </select>
      </div>
      <button id="restartBtn" class="restart">↻ Ulangi</button>
    </section>
    <footer>Demo browser • Simpan progres tidak tersedia • Kalahkan AI untuk menang!</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
